name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.6"
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile device helper
        env:
          DEPLOY_KEY: ${{ secrets.DEVICE_BRIDGE_DEPLOY_KEY }}
        run: |
          dist="$RUNNER_TEMP/helper"
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::notice::DEVICE_BRIDGE_DEPLOY_KEY not set — embedding a placeholder helper; device commands will be inert."
            for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
              name="bridge"; case "$target" in windows_*) name="bridge.exe" ;; esac
              mkdir -p "$dist/$target"
              printf 'drizz-device-helper-placeholder\nThis file is replaced with the compiled device helper at release build time.\n' > "$dist/$target/$name"
              shasum -a 256 "$dist/$target/$name" | awk '{print $1}' > "$dist/$target/$name.sha256"
            done
            echo "DRIZZ_HELPER_DIST=$dist" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/device_bridge && chmod 600 ~/.ssh/device_bridge
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          src="$RUNNER_TEMP/device-bridge"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/device_bridge -o IdentitiesOnly=yes" git clone --depth 1 git@github.com:DrizzDev/device-bridge.git "$src"
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          ( cd "$src" && npm ci && bash scripts/compile )
          echo "DRIZZ_HELPER_DIST=$src/dist/helper" >> "$GITHUB_ENV"

      - name: Detect signing
        id: signing
        env:
          CERTIFICATE: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "${CERTIFICATE}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing certificate configured — publishing unsigned."
          fi

      - name: Set up code signing
        if: steps.signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm certificate.p12
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install goreleaser
        run: brew install goreleaser

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DRIZZ_SIGN: ${{ steps.signing.outputs.enabled }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make release
